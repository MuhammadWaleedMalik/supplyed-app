buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// SupplyEd uses PaymentSheet/Connect, not Stripe Issuing push provisioning.
// AGP 9 lint resolves transitives of Stripe's optional compileOnly dependency,
// including Google's privately distributed TapAndPay SDK. Keep lint enabled;
// exclude only that unused SDK from Stripe's lint dependency classpath.
subprojects { subproject ->
    if (subproject.name == "stripe_stripe-react-native") {
        subproject.configurations.configureEach { configuration ->
            if (configuration.name.endsWith("LintChecksClasspath")) {
                configuration.exclude group: "com.google.android.gms", module: "play-services-tapandpay"
            }
        }
    }
}
